<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ray's Plan</title>
<!--
  Дашборд бота Ray's Plan (Telegram Mini App). Статическая страница без сервера:
  данные приходят в адресе после #d= (JSON → deflate-raw → base64url, см. app_data/app_url
  в plan_bot.py), правки уходят обратно боту через Telegram.WebApp.sendData — это работает,
  когда дашборд открыт кнопкой «📊 Дашборд» под полем ввода.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #efeff4; --card: #ffffff; --text: #000000; --hint: #8e8e93; --link: #2481cc;
    --btn: #2481cc; --btn-text: #ffffff; --line: rgba(60, 60, 67, .14);
    --ok: #34c759; --min: #f4c20d; --miss: #ff453a; --empty: rgba(142, 142, 147, .32);
    --off: rgba(142, 142, 147, .09); --poop: #a8704a;
    --c-bg: var(--tg-theme-secondary-bg-color, var(--bg));
    --c-card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--card)));
    --c-text: var(--tg-theme-text-color, var(--text));
    --c-hint: var(--tg-theme-hint-color, var(--hint));
    --c-link: var(--tg-theme-link-color, var(--link));
    --c-btn: var(--tg-theme-button-color, var(--btn));
    --c-btn-text: var(--tg-theme-button-text-color, var(--btn-text));
    --c-line: var(--tg-theme-section-separator-color, var(--line));
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --link: #6ab3f3; --btn: #3e88f7; --line: rgba(84, 84, 88, .55); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 12px 12px calc(28px + env(safe-area-inset-bottom));
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--c-bg); color: var(--c-text); -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--c-link); outline-offset: 2px; }
  .hint { color: var(--c-hint); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 4px 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .stamp { font-size: 13px; text-align: right; }
  .stamp button { color: var(--c-link); margin-left: 6px; }
  .stamp .old { color: var(--miss); }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; color: var(--c-hint); }
  .card { background: var(--c-card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }
  .task { font-size: 17px; font-weight: 600; margin-bottom: 12px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--c-bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .chip b { font-size: 15px; }
  .seg { display: inline-flex; background: var(--c-bg); border-radius: 9px; padding: 2px; flex-shrink: 0; }
  .seg button { padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--c-hint); }
  .seg button.on { background: var(--c-card); color: var(--c-text); font-weight: 600; }
  .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin: 12px 0 5px; }
  .row-head .hint { font-size: 13px; white-space: nowrap; }
  .strip { display: grid; gap: 3px; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: var(--off); font-size: 10px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; color: #fff; min-width: 0; }
  .m2 { background: var(--ok); } .m1 { background: var(--min); } .m0 { background: var(--miss); } .mn { background: var(--empty); }
  .p { background: var(--poop); }
  .today { box-shadow: 0 0 0 2px var(--c-card), 0 0 0 3.5px var(--c-link); }
  .days .cell { background: none; aspect-ratio: auto; height: 20px; color: var(--c-hint); font-weight: 500; font-size: 11px; }
  .days .we { color: var(--c-link); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--c-hint); font-size: 10px; font-family: inherit; }
  svg .grid { stroke: var(--c-line); stroke-width: .6; }
  svg .target { stroke: var(--c-hint); stroke-width: 1; stroke-dasharray: 2 2; }
  svg .ok { fill: var(--ok); } svg .late { fill: var(--min); } svg .miss { fill: var(--miss); }
  svg .dot { fill: var(--c-link); }
  svg .game { fill: #a970ff; stroke: var(--c-card); stroke-width: 1; }
  svg .wline { fill: none; stroke: var(--c-link); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .note { font-size: 13px; margin: 10px 0 0; }
  .empty { font-size: 14px; margin: 0; }
  .shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .42); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; max-height: 90vh; overflow-y: auto; background: var(--tg-theme-bg-color, var(--card));
           border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; }
  .sheet .sub { font-size: 13px; margin: 0 0 8px; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0;
          border-bottom: 1px solid var(--c-line); }
  .item:last-of-type { border-bottom: 0; }
  .item small { display: block; font-size: 12px; color: var(--c-hint); }
  .mark { font-size: 22px; width: 52px; height: 38px; border-radius: 10px; background: var(--c-bg); flex-shrink: 0; }
  input[type=time] { font: inherit; font-size: 16px; padding: 7px 8px; border-radius: 10px; border: 0;
                     background: var(--c-bg); color: inherit; min-width: 112px; color-scheme: light dark; }
  .group { font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--c-hint); margin: 14px 0 0; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .primary { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; background: var(--c-btn); color: var(--c-btn-text); }
  .secondary { padding: 12px 16px; border-radius: 12px; background: var(--c-bg); }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20;
           background: rgba(30, 30, 30, .92); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 14px;
           overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Ray's Plan</h1>
  <div id="stamp" class="stamp hint"></div>
</header>
<main id="app"><section class="card"><p class="empty hint">Загружаю…</p></section></main>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = Boolean(tg && tg.platform && tg.platform !== 'unknown');
const WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const ICON = { '2': '✅', '1': '🟡', '0': '❌', '.': '⬜' };
const CELL = { '2': 'm2', '1': 'm1', '0': 'm0', '.': 'mn', '-': '' };
let D = null, N = 0, F0 = 0, range = 14, sheet = null, stale = false;

function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false || kid === '') continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function sv(tag, attrs, text) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

const pad = n => String(n).padStart(2, '0');
const fmtM = m => { m = Math.round(m); return `${pad(Math.floor(m / 60) % 24)}:${pad(((m % 60) + 60) % 60)}`; };
const utc = s => Date.parse(s + 'T00:00:00Z');
const dayAt = i => new Date(utc(D.from) + i * 864e5);
const idxOf = s => Math.round((utc(s) - utc(D.from)) / 864e5);
const wd = date => (date.getUTCDay() + 6) % 7;                 // 0 — понедельник, как в Python
const iso = date => date.toISOString().slice(0, 10);
const fmtDay = date => `${WD[wd(date)]}, ${date.getUTCDate()} ${MON[date.getUTCMonth()]}`;
const isDone = c => c === '1' || c === '2';
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const markAt = (i, k) => (i < F0 ? '-' : D.marks[i][k]);     // до первого дня бота ничего не считаем
const isOff = i => (D.off ? Boolean(D.off[i]) : wd(dayAt(i)) >= 5);  // нерабочий день: выходной или праздник
const known = v => v !== null && v !== undefined;

function haptic(kind) {
  try {
    if (kind === 'select') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.impactOccurred('light');
  } catch (e) { /* вне Telegram вибрации нет */ }
}

function toast(text) {
  document.querySelector('.toast')?.remove();
  const t = h('div', { class: 'toast', role: 'status' }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 4500);
}

// Telegram дописывает свои параметры запуска (tgWebAppVersion и т. п.) к фрагменту через «&»,
// поэтому d ищем среди них; в query-строке — на случай, если бот положит данные туда.
async function load() {
  const m = `${location.hash}&${location.search}`.match(/[#&?]d=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  if (typeof DecompressionStream === 'undefined') throw new Error('no-inflate');  // iOS до 16.4
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}

// Серия — как в боте: подряд выполненные дни по плану; сегодняшний неотмеченный день серию не рвёт.
function streakOf(k) {
  let n = 0;
  for (let i = N - 1; i >= 0; i--) {
    const c = markAt(i, k);
    if (c === '-' || (i === N - 1 && c === '.')) continue;
    if (!isDone(c)) break;
    n++;
  }
  return n;
}

function share(k, from) {
  let ok = 0, all = 0;
  for (let i = Math.max(from, F0); i < N; i++) {
    const c = markAt(i, k);
    if (c === '-' || (i === N - 1 && c === '.')) continue;
    all++;
    if (isDone(c)) ok++;
  }
  return all ? Math.round(100 * ok / all) : null;
}

function render() {
  document.getElementById('app').replaceChildren(todayCard(), gridCard(), sleepCard(), instaCard(), weightCard());
}

function todayCard() {
  const today = dayAt(N - 1);
  const title = D.line ? `🎯 ${D.line}` : !isOff(N - 1) ? '🎯 Задача дня не записана'
    : wd(today) < 5 ? '🏖 Сегодня праздник' : '🏖 Сегодня выходной';
  const plan = [...D.marks[N - 1]].filter(c => c !== '-');
  let weekOk = 0, weekAll = 0;
  for (let i = Math.max(F0, N - 7); i < N; i++) {
    for (const c of D.marks[i]) {
      if (c === '-' || (i === N - 1 && c === '.')) continue;
      weekAll++;
      if (isDone(c)) weekOk++;
    }
  }
  let best = null;
  D.habits.forEach(([, emoji, short], k) => {
    const n = streakOf(k);
    if (n >= 2 && (!best || n > best.n)) best = { n, emoji, short };
  });
  return h('section', { class: 'card' },
    h('h2', {}, `${stale ? 'Последний день в данных' : 'Сегодня'} · ${fmtDay(today)}`),
    h('div', { class: 'task' }, title),
    h('div', { class: 'chips' },
      h('span', { class: 'chip' }, 'Отмечено ', h('b', {}, `${plan.filter(isDone).length} из ${plan.length}`)),
      weekAll ? h('span', { class: 'chip' }, 'За 7 дней ', h('b', {}, `${Math.round(100 * weekOk / weekAll)}%`)) : null,
      best ? h('span', { class: 'chip' }, `${best.emoji} ${best.short}: `, h('b', {}, `${best.n} подряд`)) : null));
}

function gridCard() {
  const from = Math.max(0, N - range), n = N - from, cols = `grid-template-columns:repeat(${n},1fr)`;
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Период' },
    [14, 28].map(r => h('button', {
      class: range === r ? 'on' : '', 'aria-pressed': String(range === r),
      onclick: () => { range = r; haptic('select'); render(); },
    }, r === 14 ? '2 недели' : '4 недели')));
  const head = h('div', { class: 'strip days', style: cols });
  for (let i = from; i < N; i++) {
    const date = dayAt(i);
    head.append(h('button', { class: 'cell' + (isOff(i) ? ' we' : ''), onclick: () => openDay(i),
                              'aria-label': `Открыть ${fmtDay(date)}${isOff(i) && wd(date) < 5 ? ' — праздник' : ''}` },
                  date.getUTCDate()));
  }
  const rows = D.habits.map(([, emoji, short], k) => {
    const strip = h('div', { class: 'strip', style: cols });
    for (let i = from; i < N; i++) {
      const c = markAt(i, k);
      strip.append(h('button', {
        class: ['cell', CELL[c], i === N - 1 ? 'today' : ''].filter(Boolean).join(' '),
        'aria-label': `${short}, ${fmtDay(dayAt(i))}: ${c === '-' ? 'не по плану' : ICON[c]}`,
        onclick: () => openDay(i),
      }));
    }
    const s = streakOf(k), p = share(k, from);
    const meta = [s >= 2 ? `🔥 ${s}` : '', p === null ? '' : `${p}%`].filter(Boolean).join(' · ');
    return [h('div', { class: 'row-head' }, h('span', {}, `${emoji} ${short}`), h('span', { class: 'hint' }, meta)), strip];
  });
  const poop = h('div', { class: 'strip', style: cols });
  let total = 0;
  for (let i = from; i < N; i++) {
    const c = D.poop[i] || 0;
    total += c;
    poop.append(h('button', { class: 'cell' + (c ? ' p' : ''), 'aria-label': `Туалет, ${fmtDay(dayAt(i))}: ${c}`,
                              onclick: () => openDay(i) }, c > 1 ? c : ''));
  }
  return h('section', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Привычки'), seg),
    head, rows,
    h('div', { class: 'row-head' }, h('span', {}, '💩 Туалет'), h('span', { class: 'hint' }, `${total} за ${n} дн.`)), poop,
    h('div', { class: 'legend hint' },
      [['var(--ok)', 'норма'], ['var(--min)', 'минимум'], ['var(--miss)', 'пропуск'], ['var(--empty)', 'не отмечено']]
        .map(([color, label]) => h('span', {}, h('i', { style: `background:${color}` }), label)),
      h('span', {}, 'нажми на день — поправить')));
}

function sleepCard() {
  const card = h('section', { class: 'card' }, h('h2', {}, 'Сон'));
  const from = Math.max(0, N - range), g = D.goals;
  const gameAt = i => (D.game && known(D.game[i]) ? D.game[i] : null);  // конец последней катки, минуты от полуночи дня
  const nights = [];
  for (let i = from; i < N; i++) {
    const wake = i + 1 < N ? D.wake[i + 1] : null;                   // ночь i кончается подъёмом дня i + 1
    nights.push({ i, bed: known(D.bed[i]) ? D.bed[i] : null, wake: known(wake) ? wake + 1440 : null, game: gameAt(i),
                  tb: g.bed[isOff(i + 1) ? 1 : 0],             // завтра выходной — отбой можно позже
                  tw: g.wake[isOff(i + 1) ? 1 : 0] + 1440 });  // и подъём тоже
  }
  if (!nights.some(n => n.bed !== null || n.wake !== null || n.game !== null)) {
    card.append(h('p', { class: 'empty hint' }, 'Жми «😴 Спать» и «☀️ Проснулся» внизу чата — здесь появится график сна.'));
    return card;
  }
  // Шкала под данные: от самого раннего отбоя, катки или цели до самого позднего подъёма или цели, с запасом.
  const values = nights.flatMap(n => [n.bed, n.wake, n.game, n.tb, n.tw]).filter(v => v !== null);
  const X0 = Math.floor((Math.min(...values) - 30) / 60) * 60;
  const X1 = Math.max(Math.ceil((Math.max(...values) + 30) / 60) * 60, X0 + 9 * 60);
  const step = X1 - X0 > 15 * 60 ? 180 : 120;
  const W = 320, L = 38, rowH = 16, top = 14, H = top + nights.length * rowH + 2;
  const x = m => L + (Math.min(Math.max(m, X0), X1) - X0) / (X1 - X0) * (W - L);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Отбой и подъём по ночам' });
  let drawnGames = 0;
  for (let t = Math.ceil((X0 + 30) / step) * step; t <= X1; t += step) {
    svg.append(sv('line', { class: 'grid', x1: x(t), x2: x(t), y1: top - 3, y2: H - 2 }));
    svg.append(sv('text', { x: x(t), y: 9, 'text-anchor': 'middle' }, fmtM(t)));
  }
  nights.forEach((n, r) => {
    const y = top + r * rowH, date = dayAt(n.i), tb = n.tb, tw = n.tw;
    svg.append(sv('text', { x: 0, y: y + rowH / 2 + 3.5 }, `${WD[wd(date)]} ${date.getUTCDate()}`));
    for (const t of [tb, tw]) svg.append(sv('line', { class: 'target', x1: x(t), x2: x(t), y1: y + 2, y2: y + rowH - 2 }));
    if (n.bed !== null && n.wake !== null) {
      const onTime = n.bed <= tb + g.grace && n.wake <= tw + g.grace;
      svg.append(sv('rect', { class: onTime ? 'ok' : 'late', x: x(n.bed), y: y + 4, rx: 4, height: rowH - 8,
                              width: Math.max(3, x(n.wake) - x(n.bed)) }));
    } else {
      for (const m of [n.bed, n.wake]) if (m !== null) svg.append(sv('circle', { class: 'dot', cx: x(m), cy: y + rowH / 2, r: 3.5 }));
    }
    const gm = n.game;
    if (gm !== null) {
      const gx = x(gm), gy = y + rowH / 2;
      svg.append(sv('path', { class: 'game', d: `M${gx},${gy - 5}L${gx + 5},${gy}L${gx},${gy + 5}L${gx - 5},${gy}Z` }));
      drawnGames++;
    }
  });
  const beds = nights.map(n => n.bed).filter(v => v !== null), wakes = nights.map(n => n.wake).filter(v => v !== null);
  const lengths = nights.filter(n => n.bed !== null && n.wake !== null).map(n => n.wake - n.bed);
  const parts = [];
  if (beds.length) parts.push(`отбой в среднем ${fmtM(avg(beds))}`);
  if (wakes.length) parts.push(`подъём ${fmtM(avg(wakes))}`);
  if (lengths.length) { const m = Math.round(avg(lengths)); parts.push(`сон ${Math.floor(m / 60)} ч ${pad(m % 60)} мин`); }
  const games = drawnGames ? ` ◆ — конец последней катки${D.gamesAt ? ` (матчи на ${D.gamesAt.slice(11, 16)} ${fmtDay(new Date(utc(D.gamesAt.slice(0, 10))))})` : ''}.` : '';
  card.append(svg, h('p', { class: 'note hint' }, `${parts.join(' · ')}${parts.length ? '. ' : ''}Пунктир — цель; жёлтый — позже цели.${games}`));
  return card;
}

function instaCard() {
  const card = h('section', { class: 'card' }, h('h2', {}, 'Инста, минут в день'));
  const from = Math.max(0, N - range), vals = D.insta.slice(from), cap = D.goals.insta;
  const list = vals.filter(known);
  if (!list.length) {
    card.append(h('p', { class: 'empty hint' }, 'Минуты Инсты появятся после вечерних чек-инов.'));
    return card;
  }
  const W = 320, H = 120, B = 14, T = 12, n = vals.length, bw = W / n, max = Math.max(cap * 1.5, ...list);
  const y = v => T + (1 - v / max) * (H - B - T);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Минуты Инсты по дням' });
  vals.forEach((v, j) => {
    const date = dayAt(from + j);
    if (known(v)) {
      svg.append(sv('rect', { class: v > cap ? 'miss' : 'ok', x: j * bw + bw * .18, width: bw * .64, rx: 2,
                              y: y(v), height: Math.max(1.5, H - B - y(v)) }));
      if (n <= 14) svg.append(sv('text', { x: j * bw + bw / 2, y: y(v) - 3, 'text-anchor': 'middle' }, v));
    }
    if (n <= 14 || (N - 1 - from - j) % 3 === 0) {
      svg.append(sv('text', { x: j * bw + bw / 2, y: H - 2, 'text-anchor': 'middle' }, date.getUTCDate()));
    }
  });
  svg.append(sv('line', { class: 'target', x1: 0, x2: W, y1: y(cap), y2: y(cap) }));
  const over = list.filter(v => v > cap).length;
  card.append(svg, h('p', { class: 'note hint' },
    `В среднем ${Math.round(avg(list))} мин, выше лимита ${over} из ${list.length} дн. Пунктир — лимит ${cap} мин.`));
  return card;
}

function weightCard() {
  const card = h('section', { class: 'card' }, h('h2', {}, 'Вес'));
  const pts = D.weight.map(([day, v]) => ({ t: utc(day), v, day }));
  if (!pts.length) {
    card.append(h('p', { class: 'empty hint' }, 'По воскресеньям присылай вес — здесь появится график.'));
    return card;
  }
  const [goal, final] = D.goals.weight, first = pts[0], last = pts[pts.length - 1];
  const W = 320, H = 130, L = 34, R = 10, T = 12, B = 16;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const goals = [goal, final].filter(gv => gv >= lo - 3 && gv <= hi + 3);
  lo = Math.min(lo, ...goals) - .6;
  hi = Math.max(hi, ...goals) + .6;
  const t1 = Math.max(last.t, first.t + 864e5);
  const x = t => L + (t - first.t) / (t1 - first.t) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Вес по взвешиваниям' });
  for (const v of [lo + .6, hi - .6]) {
    svg.append(sv('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
    svg.append(sv('text', { x: L - 6, y: y(v) + 3.5, 'text-anchor': 'end' }, v.toFixed(1)));
  }
  for (const gv of goals) {
    svg.append(sv('line', { class: 'target', x1: L, x2: W - R, y1: y(gv), y2: y(gv) }));
    svg.append(sv('text', { x: W - R, y: y(gv) - 3, 'text-anchor': 'end' }, `цель ${gv}`));
  }
  svg.append(sv('polyline', { class: 'wline', points: pts.map(p => `${x(p.t)},${y(p.v)}`).join(' ') }));
  pts.forEach(p => svg.append(sv('circle', { class: 'dot', cx: x(p.t), cy: y(p.v), r: 3 })));
  for (const p of pts.length > 1 ? [first, last] : [first]) {
    const date = new Date(p.t);
    svg.append(sv('text', { x: x(p.t), y: H - 2, 'text-anchor': p === first ? 'start' : 'end' }, `${date.getUTCDate()} ${MON[date.getUTCMonth()]}`));
  }
  const delta = last.v - first.v;
  const rest = last.v < goal ? `до ${goal} кг осталось ${(goal - last.v).toFixed(1)}`
    : last.v < final ? `до ${final} кг осталось ${(final - last.v).toFixed(1)}` : `цель ${final} кг есть 🏆`;
  const since = pts.length > 1 ? `, ${delta >= 0 ? '+' : ''}${delta.toFixed(1)} с ${fmtDay(new Date(first.t))}` : '';
  card.append(svg, h('p', { class: 'note hint' }, `Сейчас ${last.v.toFixed(1)} кг${since} · ${rest}`));
  return card;
}

// ── Лист дня: правка отметок и времени сна ─────────────────────────────
function openDay(i) {
  haptic('impact');
  const marks = [...D.marks[i]];
  sheet = { i, marks, orig: [...marks], wake: D.wake[i], bed: D.bed[i], wakeIn: null, bedIn: null };
  drawSheet();
  document.body.style.overflow = 'hidden';
  if (inTg) {
    tg.BackButton.onClick(closeSheet);
    tg.BackButton.show();
    tg.MainButton.setText('Сохранить');
    tg.MainButton.onClick(save);
    tg.MainButton.show();
  }
}

function closeSheet() {
  sheet = null;
  document.getElementById('shade')?.remove();
  document.body.style.overflow = '';
  if (inTg) {
    tg.BackButton.offClick(closeSheet);
    tg.BackButton.hide();
    tg.MainButton.offClick(save);
    tg.MainButton.hide();
  }
}

function drawSheet() {
  document.getElementById('shade')?.remove();
  const date = dayAt(sheet.i), g = D.goals;
  const tw = g.wake[isOff(sheet.i) ? 1 : 0], tb = g.bed[isOff(sheet.i + 1) ? 1 : 0];
  const gk = D.habits.findIndex(([key]) => key === 'games'), gmark = gk >= 0 ? markAt(sheet.i, gk) : '-';
  const gameText = (D.game && known(D.game[sheet.i]) ? `${fmtM(D.game[sheet.i])} · ${D.gameName[sheet.i]}`
    : gmark === '2' ? 'каток не было' : 'нет данных') + (gmark === '2' || gmark === '0' ? ` ${ICON[gmark]}` : '');
  sheet.wakeIn = h('input', { type: 'time', value: known(sheet.wake) ? fmtM(sheet.wake) : null, 'aria-label': 'Во сколько встал' });
  sheet.bedIn = h('input', { type: 'time', value: known(sheet.bed) ? fmtM(sheet.bed) : null, 'aria-label': 'Во сколько лёг' });
  const items = D.habits.map(([, emoji, short, hasMin, auto], k) => {
    if (auto || sheet.marks[k] === '-') return null;  // «катки» считаются по матчам — их не переключаем
    const btn = h('button', { class: 'mark', 'aria-label': `${short}: сменить отметку` }, ICON[sheet.marks[k]]);
    btn.addEventListener('click', () => {
      const order = hasMin ? ['.', '2', '1', '0'] : ['.', '2', '0'];
      sheet.marks[k] = order[(order.indexOf(sheet.marks[k]) + 1) % order.length];
      btn.textContent = ICON[sheet.marks[k]];
      haptic('select');
    });
    return h('div', { class: 'item' }, h('span', {}, `${emoji} ${short}`), btn);
  });
  const shade = h('div', { class: 'shade', id: 'shade' },
    h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': fmtDay(date) },
      h('h3', {}, fmtDay(date)),
      h('p', { class: 'sub hint' }, 'Отметки как в чек-ине: ⬜ → ✅ → 🟡 → ❌'),
      h('div', { class: 'group' }, 'Сон'),
      h('div', { class: 'item' }, h('span', {}, '⏰ Встал', h('small', {}, `цель ${fmtM(tw)}`)), sheet.wakeIn),
      h('div', { class: 'item' }, h('span', {}, '😴 Лёг', h('small', {}, `вечером этого дня, цель до ${fmtM(tb)}`)), sheet.bedIn),
      h('div', { class: 'item' }, h('span', {}, '🎮 Последняя катка', h('small', {}, 'отсюда «катки до срока»; обновляется кнопкой ↻')),
        h('span', { class: 'hint' }, gameText)),
      h('div', { class: 'group' }, 'Привычки'),
      items,
      inTg ? null : h('div', { class: 'actions' },
        h('button', { class: 'primary', onclick: save }, 'Сохранить'),
        h('button', { class: 'secondary', onclick: closeSheet }, 'Отмена'))));
  shade.addEventListener('click', e => { if (e.target === shade) closeSheet(); });
  document.body.append(shade);
}

function save() {
  if (!sheet) return;
  const payload = { v: 1, day: iso(dayAt(sheet.i)) }, marks = {};
  D.habits.forEach(([key], k) => {
    if (sheet.marks[k] !== sheet.orig[k]) marks[key] = sheet.marks[k] === '.' ? null : Number(sheet.marks[k]);
  });
  if (Object.keys(marks).length) payload.marks = marks;
  for (const key of ['wake', 'bed']) {
    const value = sheet[key + 'In'].value, before = known(sheet[key]) ? fmtM(sheet[key]) : '';
    if (value !== before) payload[key] = value || null;
  }
  if (Object.keys(payload).length === 2) { closeSheet(); return; }
  if (inTg) { tg.sendData(JSON.stringify(payload)); return; }   // Telegram закроет дашборд, бот ответит в чате
  toast('Вне Telegram не сохраняется. Бот получил бы: ' + JSON.stringify(payload));
}

function refresh() {
  if (inTg) tg.sendData(JSON.stringify({ v: 1, cmd: 'refresh' }));
  else location.reload();
}

(async () => {
  if (tg) { tg.ready(); tg.expand(); }
  const app = document.getElementById('app');
  try {
    D = await load();
  } catch (e) {
    const text = e.message === 'no-inflate'
      ? 'Telegram открывает страницы слишком старым браузером: нужен iOS 16.4 или новее. Обнови систему или открой дашборд в Telegram на компьютере.'
      : 'Не получилось прочитать данные. Отправь боту /start и открой «📊 Дашборд» ещё раз.';
    app.replaceChildren(h('section', { class: 'card' }, h('p', { class: 'empty' }, text)));
    return;
  }
  if (!D) {
    const got = [...new URLSearchParams(location.hash.slice(1)).keys()].join(', ');  // для отладки: что прислал Telegram
    app.replaceChildren(h('section', { class: 'card' },
      h('p', { class: 'empty' }, 'Открой дашборд кнопкой «📊 Дашборд» под полем ввода в чате с ботом — данные приходят вместе с кнопкой.'),
      got ? h('p', { class: 'note hint' }, `В ссылке только: ${got}`) : null));
    return;
  }
  N = D.marks.length;
  F0 = D.first ? Math.max(0, idxOf(D.first)) : 0;
  const at = new Date(utc(D.at.slice(0, 10)));
  stale = Date.now() - Date.parse(D.at) > 3 * 36e5;  // кнопка обновляется только вместе с ответами бота
  document.getElementById('stamp').replaceChildren(
    `данные на ${fmtDay(at)}, ${D.at.slice(11, 16)}`,
    stale ? h('span', { class: 'old' }, ' · устарели') : null,
    h('button', { onclick: refresh, 'aria-label': 'Обновить данные и матчи' }, '↻'));
  render();
})();
</script>
